    <h1 id="page-title"> Graphs </h1>
    <div id="controls-container">
      <label for="dataset-select"> Dataset: </label>
      <select id="dataset-select">
        <option value="clan_members">Clan Members</option>
        <option value="former_members">Former Clan Members</option>
        <option value="monthly_analysis">Monthly Analysis</option>
      </select>
      <label for="graph-type-select"> Graph: </label>
      <select id="graph-type-select">
        <option value="area">Area</option>
        <option value="bar" selected>Bar</option>
        <option value="box">Box</option>
        <option value="density">Density</option>
        <option value="funnel">Funnel</option>
        <option value="heatmap">Heatmap</option>
        <option value="histogram">Histogram</option>
        <option value="line">Line</option>
        <option value="pie">Pie</option>
        <option value="polar">Polar</option>
        <option value="scatter">Scatter</option>
        <option value="scatter3d">Scatter 3D</option>
        <option value="sunburst">Sunburst</option>
        <option value="treemap">Treemap</option>
        <option value="violin">Violin</option>
        <option value="waterfall">Waterfall</option>
      </select>
      <div id="single-month-container">
        <label for="month-select"> Month: </label>
        <select id="month-select">
          <option value="01">JAN</option>
          <option value="02">FEB</option>
          <option value="03">MAR</option>
          <option value="04">APR</option>
          <option value="05">MAY</option>
          <option value="06">JUN</option>
          <option value="07">JUL</option>
          <option value="08">AUG</option>
          <option value="09">SEP</option>
          <option value="10" selected>OCT</option>
          <option value="11">NOV</option>
          <option value="12">DEC</option>
        </select>
        <label for="year-select"> Year: </label>
        <select id="year-select">
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026" selected>2026</option>
        </select>
      </div>
      <div id="range-container" style="display:none;">
        <label for="range-select"> Month: </label>
        <select id="range-select">
          <option value="01-02">JAN-FEB</option>
          <option value="02-03">FEB-MAR</option>
          <option value="03-04">MAR-APR</option>
          <option value="04-05">APR-MAY</option>
          <option value="05-06">MAY-JUN</option>
          <option value="06-07">JUN-JUL</option>
          <option value="07-08">JUL-AUG</option>
          <option value="08-09">AUG-SEP</option>
          <option value="09-10">SEP-OCT</option>
          <option value="10-11">OCT-NOV</option>
          <option value="11-12">NOV-DEC</option>
          <option value="12-01">DEC-JAN</option>
        </select>
        <label for="range-year"> Year: </label>
        <select id="range-year">
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026" selected>2026</option>
        </select>
      </div>
      <button type="button" id="load-graphs"> Fetch Data </button>
    </div>
    <div id="status-message"></div>
    <div id="charts-container"></div>
    <script src="js/graph-render.js"></script>
    <script src="js/graph-router.js"></script>
    <script src="js/graph-ui.js"></script>
